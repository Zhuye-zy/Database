<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>{% block title %}专利数据库{% endblock %}</title>
<style>
  body { font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         margin:0; background:#f5f6f8; color:#222; }
  header { background:#1f3b73; color:#fff; padding:12px 24px; }
  header a { color:#fff; text-decoration:none; margin-right:16px; }
  main { padding: 24px; max-width: 1200px; margin: 0 auto; }
  table { border-collapse: collapse; width: 100%; background:#fff; }
  th, td { border:1px solid #ddd; padding:6px 10px; font-size:13px;
           text-align:left; vertical-align:top; }
  th { background:#eef2f8; }
  tr:nth-child(even) td { background:#fafbfd; }
  .pager { margin-top:12px; }
  .pager a { margin-right:8px; }
  .badge { display:inline-block; padding:2px 8px; background:#e6f0ff;
           border-radius:10px; font-size:12px; }
  h2 { margin-top: 28px; }
  pre { background:#f0f2f5; padding:8px; border-radius:4px; overflow:auto; }
</style>
</head>
<body>
<header>
  <a href="{{ url_for('index') }}">首页</a>
  <span>专利数据库 · 第三阶段 C 角色</span>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
